name: Emulator Test

# Runs the app on a real Android emulator in CI (hardware acceleration is
# available on GitHub's Ubuntu runners, unlike a container sandbox).
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:assembleDebug --no-daemon
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.vireo.editor/.MainActivity
            sleep 20
            adb shell screencap -p /sdcard/launch.png
            adb pull /sdcard/launch.png launch.png
            # fail if the app crashed
            if adb shell dumpsys activity | grep -q "com.vireo.editor"; then
              echo "App is running"
            else
              echo "App not running"; exit 1
            fi

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: launch.png
